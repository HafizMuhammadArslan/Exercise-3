<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script >
        function calculateSum() {
    const a = parseInt(document.getElementById('a').value);
    const b = parseInt(document.getElementById('b').value);
    const n = parseInt(document.getElementById('n').value);
  
    if (isNaN(a) || isNaN(b) || isNaN(n)) {
      alert(" Please enter the valid numbers for a, b, and n.");
      return;
    }
    let total = 0;
    for (let i = 1; i < n; i++) {
      if (i % a === 0 || i % b === 0) {
        total += i;
      }
    }
    alert(`The sum of all multiples of ${a} or ${b} below ${n} is: ${total}`);
  }
    </script>
</head>
<body>
    <h1>Calculate Sum of Multiples</h1>
    <label for="a">Enter value of a:</label>
    <input type="number" id="a"><br><br>
  
    <label for="b">Enter value of b:</label>
    <input type="number" id="b"><br><br>
  
    <label for="n">Enter upper limit (n):</label>
    <input type="number" id="n"><br><br>
  
    <button onclick="calculateSum()">Calculate Sum</button>
    
</body>
</html>
